<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - C.M. Health Clinic</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f6fa;
            color: #2d3436;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 20px 24px 24px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 1.3rem;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #636e72;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #dfe6e9;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .btn {
            margin-top: 12px;
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #0984e3;
            background-color: #0984e3;
            color: #ffffff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0c6fbd;
        }

        .error {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #d63031;
        }

        .back-link {
            margin-top: 12px;
            font-size: 0.8rem;
            text-align: center;
        }

        .back-link a {
            color: #0984e3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>{{ clinic.name or "Admin Login" }}</h1>
        {% if clinic.address %}
        <div class="subtitle">
            {{ clinic.address }}<br>
            Ph: {{ clinic.phone }} | E-mail: {{ clinic.email }}
        </div>
        {% else %}
        <div class="subtitle">Admin access to OPD analytics</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>

        <div class="back-link">
            <a href="/">&#8592; Back to main page</a>
        </div>
    </div>
</body>

</html>
